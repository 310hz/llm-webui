services:

  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    ports:
      - "50011:8080"
    volumes:
      - ./data/openwebui:/app/backend/data
    environment:
      - WEBUI_AUTH=false
      - OPENAI_API_BASE_URL=http://host.docker.internal:50012/v1
    restart: always
    mem_limit: 512m
